name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    branches: [main]

jobs:
  core-tests:
    name: core tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install --upgrade pip numpy PyYAML pytest opencv-python-headless
      - name: Unit tests
        run: python -m pytest tests -q
      - name: Mock detector smoke
        run: python scripts/check_gpu_backend.py --backend mock --json > /dev/null
      - name: Ore scene selftest
        run: python scripts/ore_scene.py selftest > /dev/null

  simulation:
    name: offline fusion simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip numpy PyYAML
      - name: Run simulation
        run: python scripts/simulate_pipeline.py

  ros-build:
    name: ros build (humble, robot target)
    runs-on: ubuntu-latest
    container: ros:humble
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-numpy python3-yaml python3-opencv \
            ros-humble-cv-bridge ros-humble-tf2-ros
      - name: Build packages
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --packages-select \
            jcheng_perception_msgs \
            jcheng_perception_core \
            jcheng_perception_edge \
            jcheng_perception_gpu \
            jcheng_perception_scene

  m1-gate:
    name: m1-gate
    runs-on: ubuntu-latest
    needs: [core-tests, simulation, ros-build]
    steps:
      - uses: actions/checkout@v4
      - name: Documentation set
        run: |
          for f in README.md README.zh-CN.md ROADMAP.md CHANGELOG.md ACCEPTANCE.md; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
      - name: Gate
        run: echo "docs, core tests, simulation and ROS build passed"
