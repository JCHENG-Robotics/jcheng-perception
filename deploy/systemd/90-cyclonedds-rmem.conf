# Raised receive buffers for the 640x480 camera image readers.
#
# The Pi default (208 KB) is smaller than one colour frame, so bursts of
# fragmented best-effort image samples overflow the reader socket. The
# CycloneDDS XML `SocketReceiveBufferSize` element is rejected by the 0.10.4
# build in the vendor container (rcl node creation fails), so raise the kernel
# defaults instead. Install as /etc/sysctl.d/90-cyclonedds-rmem.conf and run
# `sysctl --system`; the values apply to sockets created after that.
net.core.rmem_max = 4194304
net.core.rmem_default = 1048576
