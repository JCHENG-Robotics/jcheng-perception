# Capability manifest for the organization's admission check.
# The repository is an L3 capability: it consumes camera streams and produces
# advisory perception state. It never commands motion.
name: jcheng-perception
version: 0.1.0
layer: L3
status: experimental

runtime_roles:
  pi5-edge:
    host: Raspberry Pi 5 (8 GB), ROS 2 Humble
    responsibilities:
      - subscribe to the D435i and wrist Aurora camera streams
      - JPEG-compress and uplink frames with capture timestamps
      - maintain per-camera depth and TF timestamp rings
      - time-match GPU detections to depth and TF
      - back-project, associate, two-view fuse, Kalman-track
      - publish FusedTargetArray for the planner
    forbidden:
      - YOLO or any detector inference
      - serial, CAN, servo or chassis access
      - publishing motion commands
  gpu-detector:
    host: laptop with GPU, ROS 2 Humble/Jazzy
    responsibilities:
      - decode the two compressed streams
      - run one asynchronous detector per camera
      - preserve the capture timestamp unchanged
      - hot-reload model weights and publish latency/health
    forbidden:
      - opening cameras
      - reading depth or TF
      - writing fused targets or motion

hardware_access:
  kind: camera_readonly
  detail: >-
    The edge subscribes to vendor camera driver topics. It does not open
    /dev/video*, USB, serial or CAN devices itself. The vendor driver remains
    the single device owner.
motion_authority: none
control_path: advisory_only
fail_closed: true

topics:
  subscribes:
    - sensor_msgs/Image or sensor_msgs/CompressedImage (camera RGB)
    - sensor_msgs/Image (depth, 16UC1 or 32FC1)
    - sensor_msgs/CameraInfo
    - tf2_msgs/TFMessage
    - jcheng_perception_msgs/Detection2DArray
  publishes:
    - sensor_msgs/CompressedImage (uplink)
    - jcheng_perception_msgs/TargetObservation
    - jcheng_perception_msgs/FusedTargetArray
    - jcheng_perception_msgs/PerceptionStatus
    - jcheng_perception_msgs/GpuStatus
    - tf2_msgs/TFMessage (wrist_tf: base_link -> camera_optical_measured)

contracts:
  status: provisional_in_repo
  promotion_target: JCHENG-Robotics/jcheng-interfaces at M2
  note: >-
    The messages are internal to this repository until the interface audit and
    M2 contract freeze. Names and fields may change before promotion.

safety:
  - No actuator command is produced or consumed.
  - A detection without a time-matched depth frame and TF sample is dropped.
  - The wrist camera has no static TF fallback; missing TF means no observation.
  - Wrist TF is computed from bus-servo positions, not the vendor
    `/joint_states` command cache; no fresh bus read means no TF.
  - Periodic state streams use best-effort QoS so a slow subscriber cannot
    block the edge executor.
  - The planner must treat an empty target array as "no target", not as "hold".

verification:
  unit_tests: 74
  reference_point_backend:
    passed: 2026-11-24 (unit test + real hardware static run)
    config: config/gpu_tag.yaml (AprilTag 36h11, 60 mm, id 0)
    hardware: external-wrist tag centre 3.77 mm; fixed-point 5 mm gate 3.67 mm (depth) / 3.07 mm (PnP) after view_bias.yaml; no 67 mm first-pair step
    rerun_min_dt: deployed f90b5d5; external-only reruns 0.4/1.8 mm (no min-dt drift); Aurora restart fixed wrist depth matching (365 -> 1); same-distro Humble GPU (jcheng-humble-tag) + uplink clock-jump/worker fixes gave a 60 s wrist-only track max 7.30 mm / p95 4.66; external tag observations still 0 because the external uplink/reader stops, so dual-view confirmation is pending
    evidence: evidence/hardware_20261124_tag_verify/
    caveats: one static pose, tag sheet curls ~7 mm; GPU external uplink reader wedge needed an edge-first/GPU-restart order
  drift_regression:
    passed: 2026-11-24 (offline replay of dual-view run-7 observations)
    evidence: evidence/analysis_20261124_drift_bias/
    result: static-target worst drift 696 mm recorded / 478 mm old tracker -> 6.4 mm with the per-view bias model
  drift_hardware_static:
    passed: 2026-11-24 (real Pi 5 + D435i + Aurora + laptop GPU; arm stationary, no motion commands)
    evidence: evidence/hardware_20261124_drift_verify/
    result: worst required-label drift 4.7 mm (90 s run, 16 s of frames) and 8.1 mm (60 s run); pre-fix reference 448-696 mm
    caveats: one 67 mm first-pair reference step; run 2 had poor wrist depth matching; absolute positions remain per-view bbox-centre points
    post_run_fix: velocity_min_dt_s=0.10; uplink clock-jump baseline reset and UplinkWorker exception handling; same-distro Humble GPU run gave wrist-only 7.30 mm over 60 s, external 0 (external uplink/reader still stops); dual-view pending
  uplink_robustness:
    passed: 2026-11-24 (tests/test_uplink_rate.py: normal gap, rate limit, backwards clock jump, long gap)
    deployed: Pi core+edge via tar; status notes expose encode_failures/rate_limited; UplinkWorker catches publish exceptions
    effect: same-distro Humble run kept the edge at 468 frames/60 s (previous stalled at 88) and external GPU frames rose 3 -> 42
  ros_build: 4 packages on ROS 2 Jazzy (2026-11-24)
  synthetic_end_to_end: passed 2026-11-23 (Pi 5 edge logic on x86, mock detector)
  gpu_backend_smoke:
    mock: passed
    onnxruntime: passed (yolov8s.onnx, CPU, 197.5 ms, 4 detections)
    openvino: passed (yolov8s.xml, CPU, 126.7 ms, 4 detections)
    ultralytics_cpu: passed (yolov8s.pt, 1.04 s first frame, 4 detections; OBB also passed)
    ultralytics_cuda: passed (torch 2.9.1+cu128, RTX 3060, 9.0 ms FP32 / 7.4 ms FP16 steady, 4 detections)
  ros_onnx_node: passed (venv Python, yolov8s.onnx, 232.8 ms/frame on CPU)
  ros_ultralytics_node: passed (venv Python, yolov8s.pt, 154.3 ms/frame steady on CPU)
  ros_ultralytics_gpu: passed (venv Python, yolov8s.pt, RTX 3060, 54.3 ms/frame average)
  pi5_arm64_build: passed (4 packages, 27.1 s, ROS 2 Humble)
  pi5_synthetic_end_to_end: passed (6.2/6.3 Hz, match 0.994, 48 ms, one fused track)
  wrist_camera: passed (driver rebuilt from local SDK; RGB 6.7-6.8 Hz, depth 3.1-6.4 Hz, 640x400)
  wrist_tf: passed (bus-servo 10 Hz, live URDF FK, 1000+ reads / 0 failures; table plane z=-0.0836 m vs -0.0825 m reference, tilt 1.21 deg, RMS 0.61 mm; single static pose)
  cross_machine_yolo: partial (Pi 5 edge + laptop RTX 3060, CycloneDDS domain 0; yolov8s.pt 2.06 fps / 55.2 ms average; 16 detections received, 0 matched because the external depth is unaligned)
  real_wrist_pipeline: data_path_passed (target emitted with mock blue detector; metric TF now measured, single-pose table check passed; multi-pose and motion not validated)
