# Shadow detector configuration.
#
# Copy to a local file, point the paths at candidate weights, and launch with
#   ros2 launch jcheng_perception_gpu shadow_gpu.launch.py \
#     gpu_config:=/abs/path/gpu_shadow.yaml
#
# The shadow node reads the same uplink images as production, but publishes to
# /perception/detections_shadow/* and /perception/debug_shadow/*. The edge only
# consumes the production /perception/detections/* topics, so the shadow model
# never affects fusion. Compare the two detection streams offline or with a
# small logger subscriber.
node:
  stats_interval_s: 2.0
  debug_publish: false
  debug_interval_s: 1.0
  queue_size: 2

cameras:
  d435i_ext:
    input_topic: /perception/uplink/d435i_ext/image_compressed
    detections_topic: /perception/detections_shadow/d435i_ext
    debug_topic: /perception/debug_shadow/d435i_ext
    hot_reload: true
    model:
      backend: ultralytics
      path: /opt/jcheng/models/ext_yolov8n_shadow.pt
      task: detect
      imgsz: 640
      conf: 0.30
      iou: 0.45
      device: "0"
      half: true
      max_detections: 20
      keypoints: false
      labels: []

  aurora_wrist:
    input_topic: /perception/uplink/aurora_wrist/image_compressed
    detections_topic: /perception/detections_shadow/aurora_wrist
    debug_topic: /perception/debug_shadow/aurora_wrist
    hot_reload: true
    model:
      backend: ultralytics
      path: /opt/jcheng/models/wrist_grasp_pose_shadow.pt
      task: pose
      imgsz: 416
      conf: 0.30
      iou: 0.45
      device: "0"
      half: true
      max_detections: 5
      keypoints: true
      labels: []
