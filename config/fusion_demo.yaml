# Fusion policy for the synthetic demo: confirm quickly so the demo reaches a
# fused target in a few frames.
target_frame: base_link
coalesce_ms: 30.0

confirm_hits: 2
tentative_timeout_s: 0.8
coast_after_s: 0.8
lost_after_s: 2.0

association_gate_m: 0.10
association_gate_growth_m: 0.10
association_gate_per_second: 0.10
association_label_agnostic: false
enable_track_merging: true
merge_gate_m: 0.06
merge_gate_overlap_m: 0.02
merge_sigma_scale: 3.0

kalman_accel_noise: 0.05
measurement_floor_m: 0.0008
max_position_variance_m2: 0.05
occlusion_penalty: 0.75
min_view_weight: 0.02

fine_distance_m: 0.55
fine_wrist_hits: 2
orientation_max_tilt_deg: 35.0
table_clearance_m: 0.008
orientation_sigma_rad: 0.20

publish_rate_hz: 30.0
pose_sample_hz: 30.0
status_rate_hz: 1.0
recheck_duration_s: 3.0
stale_gpu_s: 1.0

phase_priors:
  SEARCH:
    external: 1.0
    wrist: 1.0
  COARSE:
    external: 1.3
    wrist: 0.6
  ACQUIRE:
    external: 1.0
    wrist: 1.0
  FINE:
    external: 0.35
    wrist: 3.0
  DROP_RECHECK:
    external: 3.0
    wrist: 0.0
