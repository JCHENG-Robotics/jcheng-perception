# Camera definitions shared by the Pi 5 edge node and the GPU host.
#
# The D435i is the fixed "external" view: coarse localization and drop-point
# recheck. The wrist Aurora 930 is the "wrist" view: fine grasp keypoints.
#
# This profile assumes ONE RealSense owner publishing colour plus aligned depth
# (align_depth_to_color), as recommended in docs/adr/0004. The currently
# deployed split mode (ext_cam_node owns /dev/video4 for UVC colour and a
# depth-only realsense2_camera publishes camera_depth_optical_frame) is NOT
# colour-aligned and must not be used for metric fusion without software
# registration. Do not mix /ext_cam/color/* with /camera/camera/depth/* here.
cameras:
  d435i_ext:
    role: external
    rgb_topic: /camera/color/image_raw
    depth_topic: /camera/aligned_depth_to_color/image_raw
    camera_info_topic: /camera/color/camera_info
    optical_frame: camera_color_optical_frame
    uplink_topic: /perception/uplink/d435i_ext/image_compressed
    detection_topic: /perception/detections/d435i_ext
    rgb_compressed: false
    depth_compressed: false
    depth_scale: 0.001
    jpeg_quality: 75
    max_uplink_fps: 15.0
    max_detection_age_ms: 400.0
    frame_match_tolerance_ms: 50.0
    # Depth+colour on the D435i can run at 4-8 Hz; the external camera is
    # static, so a 200 ms-old depth is still spatially valid.
    depth_match_tolerance_ms: 200.0
    pose_match_tolerance_ms: 60.0
    frame_buffer_seconds: 5.0
    depth_buffer_seconds: 5.0
    pose_buffer_seconds: 5.0
    max_buffer_items: 256
    pixel_sigma_px: 1.5
    # D435i stereo: sigma_z ~ z^2 * disparity_sigma / (fx * baseline).
    # 0.0025 at 1 m is ~2.5 mm, consistent with a 0.1 px disparity noise
    # and the 50 mm baseline. Tune from a depth-noise sweep on the robot.
    depth_noise_quadratic: 0.0025
    depth_noise_floor_m: 0.0015
    min_depth_m: 0.15
    max_depth_m: 3.0
    min_valid_depth_fraction: 0.15
    min_range_m: 0.15
    max_range_m: 2.0
    range_penalty_width_m: 0.50
    keypoint_min_confidence: 0.25
    max_keypoints: 8
    keypoint_axis_pairs: []
    pose_static: true
    # Measured UVC color intrinsics, 1280x720, RMS 0.51 px
    # (jcheng-manipulation evidence/calibration/20261120). Used only until the
    # driver CameraInfo arrives; the message always wins.
    intrinsics:
      - [892.1014568378095, 0.0, 648.0281250804702]
      - [0.0, 892.1014568378095, 380.1575036209251]
      - [0.0, 0.0, 1.0]
    distortion:
      [0.14971375015723185, -0.44610982176402497, 6.162088294137897e-06,
       -0.00012207241044489517, 0.34121030114110457]

  aurora_wrist:
    role: wrist
    rgb_topic: /depth_cam/rgb/image_raw
    depth_topic: /depth_cam/depth/image_raw
    camera_info_topic: /depth_cam/rgb/camera_info
    # Measured OpenCV optical frame, published as a static child of
    # rgb_camera_link. Do not use rgb_camera_link or
    # depth_cam_color_optical_frame for back-projection.
    optical_frame: camera_optical_calibrated
    uplink_topic: /perception/uplink/aurora_wrist/image_compressed
    detection_topic: /perception/detections/aurora_wrist
    rgb_compressed: false
    depth_compressed: false
    depth_scale: 0.001
    jpeg_quality: 80
    # The Aurora runs at ~12 Hz RGB / ~8 Hz depth over USB 2.0.
    max_uplink_fps: 12.0
    max_detection_age_ms: 500.0
    frame_match_tolerance_ms: 80.0
    depth_match_tolerance_ms: 150.0
    pose_match_tolerance_ms: 80.0
    frame_buffer_seconds: 5.0
    depth_buffer_seconds: 5.0
    pose_buffer_seconds: 5.0
    max_buffer_items: 256
    pixel_sigma_px: 1.5
    # Close-range stereo. Initial value; replace with a measured noise sweep.
    depth_noise_quadratic: 0.015
    depth_noise_floor_m: 0.0020
    min_depth_m: 0.08
    max_depth_m: 1.20
    min_valid_depth_fraction: 0.10
    min_range_m: 0.10
    max_range_m: 0.90
    range_penalty_width_m: 0.20
    keypoint_min_confidence: 0.25
    max_keypoints: 8
    # For a two-keypoint grasp model, uncomment to align the target yaw with
    # the detected grasp axis:
    # keypoint_axis_pairs: [[0, 1]]
    # Driver-reported RGB intrinsics, 640x400, plumb_bob (2026-11-17).
    intrinsics:
      - [418.0542, 0.0, 308.7825]
      - [0.0, 419.1000, 187.1342]
      - [0.0, 0.0, 1.0]
    distortion:
      [0.00960977, -0.05017150, 0.00056402, -0.00070902, 0.03192810]
